<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи — админка</title>
<script src="luxon.min.js?v=3.7.2"></script>
<script async src="telegram-web-app.js"></script>
<style>
  /* Светлая по умолчанию, тёмная — из Telegram или из настроек телефона. */
  :root {
    --bg:#f1f3f5; --card:#fff; --t:#14171a; --m:#6b7280; --b:#e3e6ea; --тень:0 1px 2px rgba(0,0,0,.06);
    --acc:#2f81f7; --acc-фон:#e8f1ff; --ok:#17914a; --ok-фон:#e6f6ec;
    --warn:#c77700; --warn-фон:#fdf3e3; --bad:#d64541; --bad-фон:#fdecec;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#15181c; --card:#1e2228; --t:#e9edf2; --m:#96a0ad; --b:#2c323a; --тень:none;
    --acc:#5ea2ff; --acc-фон:#1d2a3d; --ok:#4bc47d; --ok-фон:#16301f;
    --warn:#e8a33d; --warn-фон:#332512; --bad:#ff6b63; --bad-фон:#3a1f1e;
  } }
  :root[data-theme="dark"] {
    --bg:#15181c; --card:#1e2228; --t:#e9edf2; --m:#96a0ad; --b:#2c323a; --тень:none;
    --acc:#5ea2ff; --acc-фон:#1d2a3d; --ok:#4bc47d; --ok-фон:#16301f;
    --warn:#e8a33d; --warn-фон:#332512; --bad:#ff6b63; --bad-фон:#3a1f1e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body { margin:0; background:var(--bg); color:var(--t);
         font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif }
  header { position:sticky; top:0; z-index:6; background:var(--card); border-bottom:1px solid var(--b) }
  .tabs { display:flex }
  .tabs button { flex:1; padding:9px 2px 7px; border:0; background:none; color:var(--m);
                 font:inherit; font-size:12px; line-height:1.2; border-bottom:3px solid transparent;
                 display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; position:relative }
  .tabs button b { font-size:20px; line-height:1; font-weight:400 }
  .tabs button.on { color:var(--acc); border-color:var(--acc); font-weight:600 }
  /* Цифры на вкладках (28.10): просрочено и на приёмку — на «Делах», хвосты — на «Я». */
  .tabs button .бдж { position:absolute; top:3px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px;
                      border-radius:9px; font-size:11px; line-height:17px; font-weight:700; font-style:normal;
                      color:#fff; background:var(--bad) }
  .tabs button .бдж.warn { background:var(--warn) }
  /* «⟳» со временем данных — на всех вкладках, а не кнопка «Обновить» на одной «Я» (28.10). */
  .tabs button.обн { flex:0 0 56px }
  .tabs button.обн span { font-size:10px; white-space:nowrap }
  .состояние { position:sticky; top:59px; z-index:5; background:var(--acc-фон); color:var(--acc);
               font-size:14px; padding:7px 14px; border-bottom:1px solid var(--b) }
  main { padding:12px 12px 40px; max-width:820px; margin:0 auto }

  /* Плитки-фильтры: цифры дня и вход в нужный список одним касанием. */
  .плитки { display:flex; gap:8px; margin-bottom:14px }
  .плитка { flex:1; background:var(--card); border:1px solid var(--b); border-radius:14px;
            padding:11px 8px; text-align:center; cursor:pointer; box-shadow:var(--тень) }
  /* Плитка красится, как виджет (28.10): есть просрочка — красная, ждёт приёмки — жёлтая; серая — нули. */
  .плитка.bad { border-color:var(--bad); background:var(--bad-фон) }
  .плитка.bad .ц, .плитка.bad .п { color:var(--bad) }
  .плитка.warn { border-color:var(--warn); background:var(--warn-фон) }
  .плитка.warn .ц, .плитка.warn .п { color:var(--warn) }
  .плитка.on { border-color:var(--acc); background:var(--acc-фон); box-shadow:0 0 0 2px var(--acc) inset }
  .плитка .ц { font-size:24px; font-weight:700; line-height:1.1 }
  .плитка .п { font-size:12px; color:var(--m); margin-top:2px }
  .плитка.on .п { color:var(--acc) }
  .плитка.on.bad .п, .плитка.on.bad .ц { color:var(--bad) }
  .плитка.on.warn .п, .плитка.on.warn .ц { color:var(--warn) }

  h2 { font-size:14px; color:var(--m); margin:14px 0 6px; display:flex; align-items:center; gap:8px;
       font-weight:600 }
  .кто { width:26px; height:26px; border-radius:50%; display:inline-grid; place-items:center;
         flex:none; color:#fff; font-size:13px; font-weight:700; vertical-align:-8px; margin-right:3px }
  .день { font-size:15px; font-weight:700; margin:20px 0 8px }

  /* Карточки плотные (25.10): было ~5 на экран, «Скоро» — 23 экрана прокрутки. */
  .card { position:relative; background:var(--card); border:1px solid var(--b); border-radius:12px;
          padding:8px 10px 8px 14px; margin-bottom:6px; box-shadow:var(--тень); overflow:hidden }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--m) }
  .card.s-Назначена::before { background:var(--acc) }
  .card.s-Перенесена::before, .card.s-Ждёт::before { background:var(--warn) }
  .card.s-Выполнена::before, .card.s-Принято::before { background:var(--ok) }
  .card.s-Отменена::before, .card.s-Не::before, .card.s-Проблема::before { background:var(--bad) }
  .card.off { opacity:.55 }
  /* Просроченная — красная полоска, какой бы ни был статус (28.10: «Назначена» синей не выдавала беды). */
  .card.проср::before { background:var(--bad) }
  .шапка { display:flex; gap:8px; align-items:flex-start }
  .имя { font-size:15px; line-height:1.3; font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere;
         display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
  .ещё { flex:none; width:34px; height:28px; border:1px solid var(--b); border-radius:8px;
         background:none; color:var(--m); font-size:16px; line-height:1; cursor:pointer; margin:-2px -2px 0 0 }
  .мета { color:var(--m); font-size:13px; line-height:1.35; margin-top:3px }
  .мета .кто { width:17px; height:17px; font-size:10px; vertical-align:-3px; margin-right:2px }
  /* Карточка ещё не ушла (планировщик): пунктир — «придёт», а не «висит». */
  .card.ждёт { border-style:dashed; background:transparent }
  .бейдж { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px;
           background:var(--b); color:var(--m); margin-right:6px; vertical-align:1px }
  .бейдж.ok { background:var(--ok-фон); color:var(--ok) }
  .бейдж.warn { background:var(--warn-фон); color:var(--warn) }
  .бейдж.bad { background:var(--bad-фон); color:var(--bad) }
  .бейдж.acc { background:var(--acc-фон); color:var(--acc) }
  .отчёт { margin-top:6px; padding:7px 9px; background:var(--bg); border-radius:9px;
           white-space:pre-wrap; font-size:14px; line-height:1.35; display:flex; gap:9px; align-items:flex-start }
  .отчёт > span { flex:1; min-width:0 }
  /* Отчётное фото — миниатюрой прямо в карточке (28.10), раньше только значок 📷. Нажатие — полный размер. */
  .отчёт .фото { flex:none; width:64px; height:64px; border-radius:8px; overflow:hidden; background:var(--b); display:block }
  .отчёт .фото img { width:100%; height:100%; object-fit:cover; display:block }
  .отчёт .файл { color:var(--acc); text-decoration:none; font-weight:600 }
  a.фото.нет { opacity:.35 }
  /* Фото во весь экран (29.10): нажатие на миниатюру, нажатие куда угодно — закрыть. */
  .фотоОкно { padding:0; border:0; background:#000; max-width:100vw; max-height:100vh; width:100vw; height:100vh; margin:0 }
  .фотоОкно[open] { display:grid; place-items:center }
  .фотоОкно img { max-width:100vw; max-height:100vh; object-fit:contain }
  .фотоОкно::backdrop { background:#000 }
  .главная { display:block; width:100%; margin-top:7px; min-height:38px; border-radius:10px;
             border:1px solid var(--ok); background:var(--ok-фон); color:var(--ok);
             font:inherit; font-size:15px; font-weight:600; cursor:pointer }
  .главная.синяя { border-color:var(--acc); background:var(--acc-фон); color:var(--acc) }

  /* Выбор пальцем: кружки людей и плитки-варианты вместо выпадающих списков. */
  .подпись { font-size:13px; color:var(--m); margin:16px 0 7px; font-weight:600 }
  .люди { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px }
  .чел { border:0; background:none; padding:0; cursor:pointer; display:flex; flex-direction:column;
         align-items:center; gap:4px; font:inherit; font-size:12px; color:var(--m); flex:none; width:60px }
  .чел .кто { width:46px; height:46px; font-size:19px; margin:0; vertical-align:0; opacity:.45;
              border:3px solid transparent }
  .чел { width:auto; min-width:58px; padding:0 3px; white-space:nowrap }
  .чел .кто.все { background:var(--m) }
  .чел.on { color:var(--t); font-weight:600 }
  .чел.on .кто { opacity:1; border-color:var(--acc) }
  /* Фильтр по людям — пилюли с переносом строки (25.10). */
  .фряд { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px }
  .фчел { display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 3px; border:1px solid var(--b);
          border-radius:99px; background:var(--card); color:var(--t); font:inherit; font-size:14px; cursor:pointer }
  .фчел .кто { width:24px; height:24px; font-size:12px; margin:0; vertical-align:0 }
  .фчел .кто.все { background:var(--m) }
  .фчел b { color:var(--m); font-weight:600 }
  .фчел.on { border-color:var(--acc); background:var(--acc-фон); color:var(--acc); font-weight:600 }
  .фчел.on b { color:var(--acc) }
  /* «Скоро»: день — строка-кнопка; свёрнутый показывает, у кого сколько. */
  .деньк { display:flex; align-items:center; gap:8px; width:100%; margin:10px 0 6px; padding:8px 10px;
           border:1px solid var(--b); border-radius:10px; background:var(--card); color:var(--t);
           font:inherit; font-size:15px; font-weight:700; text-align:left; cursor:pointer }
  .деньк .кто { width:20px; height:20px; font-size:11px; vertical-align:middle; margin-right:2px }
  .деньк .кто-n { font-size:14px; font-weight:600; color:var(--m); margin-right:8px; vertical-align:middle }
  .деньк .люди-дня { flex:1; text-align:right; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .деньк.открыт { background:transparent; border-color:transparent; padding-left:2px }
  /* Выходные в «Скоро» — приглушённо (28.10). */
  .деньк.вых { color:var(--m); background:var(--bg) }
  .деньк.вых.открыт { background:transparent }
  /* Поиск в «Задачах» (28.10: 54 задачи — 5,5 экрана прокрутки, искать было нечем). */
  .поиск { width:100%; font:inherit; font-size:16px; padding:10px 12px; margin-bottom:8px; border:1px solid var(--b);
           border-radius:11px; background:var(--card); color:var(--t) }
  .выбор { display:flex; gap:8px; flex-wrap:wrap }
  /* Фильтры «Задач» — поменьше: три ряда больших кнопок занимали пол-экрана. */
  .выбор.мал { gap:6px }
  .выбор.мал .вар { min-height:34px; padding:5px 11px; font-size:14px; border-radius:99px }
  .вар { border:1px solid var(--b); background:var(--card); color:var(--t); border-radius:12px;
         padding:10px 13px; min-height:46px; font:inherit; font-size:15px; cursor:pointer }
  .вар.on { border-color:var(--acc); background:var(--acc-фон); color:var(--acc); font-weight:600 }
  .сетка { display:grid; grid-template-columns:repeat(8,1fr); gap:6px }
  .сетка .вар { padding:0; min-height:40px; font-size:14px; text-align:center }
  .поле { width:100%; font:inherit; font-size:17px; padding:12px 13px; border:1px solid var(--b);
          border-radius:12px; background:var(--card); color:var(--t) }
  textarea.поле { font-size:16px }
  .создать { width:100%; min-height:54px; margin-top:18px; border-radius:13px; border:0;
             background:var(--acc); color:#fff; font:inherit; font-size:18px; font-weight:600; cursor:pointer }
  .создать[disabled] { opacity:.45 }
  .готово { background:var(--ok-фон); color:var(--ok); border:1px solid var(--ok); border-radius:12px;
            padding:12px 14px; margin-bottom:14px; font-size:15px }
  .фильтры { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px }
  select, .кнопка { font:inherit; font-size:15px; padding:9px 12px; min-height:44px;
                    border:1px solid var(--b); border-radius:11px; background:var(--card);
                    color:var(--t); cursor:pointer }
  .кнопка.главный { border-color:var(--acc); color:var(--acc); background:var(--acc-фон);
                    font-weight:600; text-decoration:none; display:inline-flex; align-items:center }
  .пусто { color:var(--m); padding:26px; text-align:center }
  .плохо { color:var(--bad); padding:14px; background:var(--bad-фон); border-radius:12px }

  dialog { border:1px solid var(--b); border-radius:16px; padding:16px; width:min(560px,94vw);
           background:var(--card); color:var(--t) }
  dialog::backdrop { background:rgba(0,0,0,.45) }
  dialog .заголовок { font-size:17px; font-weight:600; white-space:pre-line; margin-bottom:6px }
  dialog label { display:block; font-size:13px; color:var(--m); margin-top:12px }
  dialog input, dialog select, dialog textarea { width:100%; font:inherit; font-size:16px;
    padding:10px 11px; border:1px solid var(--b); border-radius:10px; background:var(--bg); color:var(--t) }
  /* Редактор задачи разделами (28.10): «Что · Кому · Когда · Отчёт», редкое — свёрнуто в «Ещё». */
  dialog .раздел { border-top:1px solid var(--b); padding-top:4px; margin-top:14px }
  dialog .раздел > .подпись, dialog details > summary { margin:8px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em }
  dialog .раздел .подпись { margin:10px 0 4px }
  dialog details > summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; color:var(--m); font-weight:600 }
  dialog details > summary::after { content:'▸'; font-size:14px; text-transform:none }
  dialog details[open] > summary::after { content:'▾' }
  dialog details > summary::-webkit-details-marker { display:none }
  dialog .пред { font-size:13px; color:var(--acc); background:var(--acc-фон); border-radius:9px; padding:7px 10px; margin-top:8px; line-height:1.35 }
  dialog .заголовок-ряд { display:flex; justify-content:space-between; align-items:center; gap:8px }
  dialog .заголовок-ряд .заголовок { margin:0; opacity:.7; font-size:14px }
  dialog .тумблер { display:flex; gap:6px }
  dialog .тумблер .вар { min-height:34px; padding:5px 12px; font-size:14px; border-radius:99px }
  dialog .тумблер .вар.on.нет { border-color:var(--bad); background:var(--bad-фон); color:var(--bad) }
  dialog label.скрыто, dialog .скрыто { display:none }
  .меню { display:flex; flex-direction:column; gap:8px; margin-top:12px }
  .меню button { width:100%; min-height:48px; font-size:16px; text-align:left; padding:0 14px;
                 border:1px solid var(--b); border-radius:11px; background:var(--bg); color:var(--t);
                 font-family:inherit; cursor:pointer }
  .меню button.опасно { color:var(--bad); border-color:var(--bad) }
  .низ { display:flex; gap:8px; justify-content:flex-end; margin-top:14px }
  .низ button { font:inherit; font-size:16px; min-height:46px; padding:0 18px; border-radius:11px;
                border:1px solid var(--b); background:var(--bg); color:var(--t); cursor:pointer }
  .низ button.да { border-color:var(--acc); background:var(--acc); color:#fff; font-weight:600 }
.галерея { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 12px; }
.влож { display: flex; flex-direction: column; gap: 4px; }
.влож img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--линия, #ddd); }
.влож .файл { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 10px;
  background: var(--карточка, #fff); border: 1px solid var(--линия, #ddd); font-size: 13px; text-align: center; padding: 6px; word-break: break-word; text-decoration: none; color: inherit; }
.влож .снять { font-size: 12px; padding: 4px; border-radius: 8px; border: 1px solid var(--линия, #ddd); background: transparent; color: inherit; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs">
    <button data-t="дела" class="on"><b>📋</b>Дела</button><button data-t="скоро"><b>🗓</b>Скоро</button>
    <button data-t="задачи"><b>🗂</b>Задачи</button><button data-t="я"><b>🙋</b>Я</button><button data-t="новая"><b>➕</b>Новая</button>
    <button class="обн" id="кОбновить" type="button" title="Обновить"><b>⟳</b><span id="тОбновлено">—</span></button>
  </div>
</header>
<div id="состояние" class="состояние" hidden></div>
<main id="main"><div class="пусто">Загружаю…</div></main>
<dialog id="dlg"></dialog>
<script>
const { DateTime } = luxon;
const TZ = 'Europe/Moscow';
const ПАРАМЫ = new URLSearchParams(location.search);
const KEY = ПАРАМЫ.get('key') || '';
// Где страница и как ходит к серверу (29.10, «админка без VPN»). 'n8n' — страницу отдал сам n8n, как было.
// 'pages' — страница с GitHub Pages (ilnur849/pokupki/admin.html, build_admin.py --pages): данные тянет
// напрямую с n8n, а когда тот не виден (без VPN запрос просто висит) — через Google-скрипт «📱 Помощник:
// пересылка», тот же, что у приложения; удачный обход помнится 10 минут. Код планировщика, люди и колонки
// на Pages не вшиты (репозиторий открытый) — приходят с сервера (/admin/code) и лежат в localStorage до
// смены версии (`версияКода` в ответах /admin/all и /admin/snap).
const РЕЖИМ = 'pages';
const ПЕРЕСЫЛКА = "https://script.google.com/macros/s/AKfycbxhCXn9NroDee32MMdNdzI-vtUGr3SaFsTcKiIx-Kga4lVbruMfjgQM_YAw0NxY-raU/exec";
const N8N = "https://n8n.ilnur849.ru";
const BASE = РЕЖИМ === 'pages' ? N8N + '/webhook' : location.pathname.replace(/\/admin.*$/, '');
const память = {
  взять: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  положить: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
const ЗАКРЫТЫ = ['Выполнена', 'Принято', 'Отменена', 'Не выполнена'];
const s = (v) => String(v === undefined || v === null ? '' : v).trim();
const э = (x) => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// ?t=вкладка открывает нужную вкладку, ?id=… — сразу редактор этой задачи
// (так «✏️ Поправить» на голосовой карточке ведёт к черновику, а не на пустые «Дела»).
// Пока таблицы не загружены — пустые списки: вкладке «Новая» хватает людей и
// колонок, вшитых при сборке (build_admin.py), и она рисуется сразу.
let ЛЮДИ0 = /*PEOPLE*/[]/*/PEOPLE*/;
let КОЛОНКИ0 = /*COLUMNS*/[]/*/COLUMNS*/;
let ПЛАНИРОВЩИК = '';
let ВЕРСИЯ_КОДА = '';
function применитьКод(к) {
  if (!к || !к.планировщик) return false;
  ПЛАНИРОВЩИК = к.планировщик; ЛЮДИ0 = к.люди || []; КОЛОНКИ0 = к.колонки || []; ВЕРСИЯ_КОДА = к.версия || '';
  return true;
}

async function fetchСеть(url, opts) {

// ждёт 4,5 с (без VPN он висит), дальше — долго: запись в таблицу с повторами может идти минуту.
async function маршрут(прямо, гугл) {
  if (РЕЖИМ !== 'pages' || !ПЕРЕСЫЛКА) return прямо(90000);
  if (черезГугл()) {
    try { return await гугл(); }
    catch (e) { if (!(e instanceof СетьНет)) throw e; запомнитьГугл(false); return прямо(8000); }   // Google тоже не ответил — вдруг VPN включили
  }
  try { const r = await прямо(прямоРаботало ? 90000 : 4500); прямоРаботало = true; return r; }
  catch (e) { if (!(e instanceof СетьНет)) throw e; запомнитьГугл(true); return гугл(); }

async function прямоЗапрос(п, q, body, bin, мс) {
  const r = await fetchСеть(`${BASE}/admin/${п}?key=${encodeURIComponent(KEY)}${q ? '&' + q : ''}`, body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: сигнал(мс) } : { signal: сигнал(мс) });
  if (!r.ok) throw new Error(`${п}: ${r.status}`);
  if (bin) return URL.createObjectURL(await r.blob());
  // Пустой ответ — workflow упал до ноды ответа (обычно Google: «too many
  // requests» при быстрых нажатиях подряд). Говорим по-русски, не «Unexpected end of JSON».
  const текст = await r.text();

async function гуглЗапрос(п, q, body, bin) {
  const r = await fetchСеть(`${ПЕРЕСЫЛКА}?p=${encodeURIComponent('admin/' + п)}&key=${encodeURIComponent(KEY)}${q ? '&' + q : ''}${bin ? '&b64=1' : ''}`,
    { method: 'POST', body: JSON.stringify(body || {}), redirect: 'follow', signal: сигнал(90000) });
  const текст = await r.text();
  if (!текст.trim()) throw new СетьНет('Google не ответил');
  let j; try { j = JSON.parse(текст); } catch (e) { throw new СетьНет('Google ответил не тем'); }
  if (j.пересылка && j.связь === false) throw new СетьНет(j.ошибка || 'сервер не ответил и через Google');
  if (j.пересылка && j.ошибка) throw new Error(j.ошибка);
  if (bin) { if (!j.b64) throw new Error(j.ошибка || 'файл не пришёл'); return 'data:' + (j.тип || 'image/jpeg') + ';base64,' + j.b64; }

// ── Диалоги. В webview Telegram prompt/confirm/alert не работают. ──
function спросить(заголовок, поля, кнопка = 'Ок') {
  return new Promise((готово) => {
    const d = document.getElementById('dlg');
    d.innerHTML = `<form method="dialog"><div class="заголовок">${э(заголовок)}</div>`
      + поля.map((f) => f.тип === 'textarea'
          ? `<label>${э(f.подпись)}<textarea name="${f.имя}" rows="3">${э(f.значение || '')}</textarea></label>`
          : `<label>${э(f.подпись)}<input name="${f.имя}" type="${f.тип === 'date' ? 'date' : 'text'}" value="${э(f.значение || '')}"></label>`).join('')
      + `<div class="низ"><button value="cancel">Отмена</button><button class="да" value="ok">${э(кнопка)}</button></div></form>`;
    // Меню «⋯» закрывается перед этим окном, а событие close приходит позже,
    // когда окно уже открыто снова, — и раньше считалось отменой: из меню
    // «Вернуть на доработку», «Принять», «Перенести», «Снять» молча ничего не
    // делали (Ильнур 18.10: «вернул на доработку, а она не поменялась»).
    // Чужое close узнаём по тому, что окно в этот момент открыто.
    d.returnValue = '';
    d.onclose = () => {
      if (d.open) return;
      if (d.returnValue !== 'ok') return готово(null);
      const fd = new FormData(d.querySelector('form')); const о = {};
      for (const f of поля) о[f.имя] = String(fd.get(f.имя) || '').trim();
      готово(о);
    };
    d.showModal(); const п = d.querySelector('input,textarea'); if (п) п.focus();
  });

  const часов = String(parseFloat(Н.часов) || 8);

async function загрузить(файлы, задача) {

    if (!r.ok) throw new Error(r.status === 413 ? 'слишком большие файлы' : 'сервер ответил ' + r.status);
    const т = await r.text(); if (!т.trim()) throw new Error('сервер не ответил');
    return JSON.parse(т);

  const гугл = async () => {
    const вб64 = (f) => new Promise((ок, нет) => { const rd = new FileReader(); rd.onload = () => ок(String(rd.result).split(',')[1] || ''); rd.onerror = () => нет(new Error('файл не прочитался')); rd.readAsDataURL(f); });
    const список = []; for (const f of файлы) список.push({ имя: f.name, тип: f.type || 'application/octet-stream', b64: await вб64(f) });
    return гуглЗапрос('upload', '', { файлы: список, задача: JSON.stringify(задача) });
  };
  const j = await маршрут(прямо, гугл);
  if (!j.ok) throw new Error(j.ошибка || 'не записалось');
  return j;
}

  if (к) к.textContent = Н.что.trim() || 'Что сделать…';
}

// ── Редактор задачи ──
// Все поля, которые редактор читает из формы и отдаёт «Задачи: правка» — и видимые, и спрятанные
// за типом повторения (скрытое поле едет как было). «Позиция» и «Месяцы» — колонки листа, в
// редакторе их не было, а планировщик по ним считает «день недели месяца» и «смену месяца».
const ПОЛЯ_ЗАДАЧИ = [['Название', 'text'], ['Исполнитель', 'select:люди'], ['Что считать выполнением', 'textarea'],
  ['Тип повторения', 'select:типы'], ['Дата / точка отсчёта', 'date'], ['Дни недели', 'text'],
  ['Числа месяца', 'text'], ['Интервал', 'text'], ['Позиция', 'text'], ['Месяцы', 'text'], ['Время', 'text'], ['Дедлайн (часов)', 'text'],
  ['Ответ', 'select:нет,текст,число,фото,варианты,форма,только файл'], ['Варианты', 'text'],
  ['Если не на смене', 'select:,слать всё равно,отдать сменщику'],
  ['Если просрочена', 'select:,следующая смена'], ['Действует с', 'date'], ['Действует по', 'date'],
  ['Активна', 'select:да,нет'], ['Комментарий', 'text']];
const ТИПЫ_ПОВТОРА = ['разовая', 'ежедневно', 'дни недели', 'числа месяца', 'раз в n дней', 'за n рабочих дней до числа',
  'день недели месяца', 'каждая смена', 'каждая n-я смена', 'первая смена недели', 'смена месяца'];
// Что спрашивает каждый тип (28.10: раньше редактор показывал все девять полей «когда» разом, и было непонятно,
// какие из них этот тип вообще читает). Неизвестный тип — все.
const ПОЛЯ_ТИПА = {
  'разовая': ['Дата / точка отсчёта'], 'ежедневно': [], 'дни недели': ['Дни недели'], 'числа месяца': ['Числа месяца'],
  'раз в n дней': ['Интервал', 'Дата / точка отсчёта'], 'за n рабочих дней до числа': ['Интервал', 'Числа месяца'],
  'день недели месяца': ['Дни недели', 'Позиция'], 'каждая смена': [], 'каждая n-я смена': ['Интервал', 'Дата / точка отсчёта'],
  'первая смена недели': ['Интервал'], 'смена месяца': ['Позиция'],
};
const ПОДПИСИ_ПОЛЕЙ = {
  'Что считать выполнением': 'Что считать выполнением', 'Дни недели': 'Дни недели — пн, вт, ср…', 'Числа месяца': 'Числа месяца — 1, 15, посл',
  'Позиция': 'Какой по счёту — 1, 2, −1 (последний)', 'Месяцы': 'Только в месяцы — 1…12, пусто — все', 'Время': 'Во сколько придёт карточка — 09:00',
  'Дедлайн (часов)': 'Срок: часов на выполнение или «до 20:00»', 'Варианты': 'Варианты ответа через запятую',
  'Если не на смене': 'Если человека нет на смене', 'Если просрочена': 'Если просрочена', 'Действует с': 'Действует с',
  'Действует по': 'Действует по', 'Комментарий': 'Комментарий — виден только вам', 'Исполнитель': 'Кто делает', 'Ответ': 'Что прислать в ответ',
  'Тип повторения': 'Как повторяется',
};
const подписьПоля = (k, тип) => k === 'Дата / точка отсчёта' ? (тип === 'разовая' ? 'Дата' : 'Отсчёт с даты')
  : k === 'Интервал' ? (тип === 'раз в n дней' ? 'Каждые n дней' : тип === 'каждая n-я смена' ? 'Каждая n-я смена' : тип === 'за n рабочих дней до числа' ? 'За сколько рабочих дней' : тип === 'первая смена недели' ? 'Раз в n недель (пусто — каждую)' : 'Интервал')
  : ПОДПИСИ_ПОЛЕЙ[k] || k;
function выбратьВариант(b, v) {
  const группа = b.parentElement; const вход = группа.previousElementSibling; вход.value = v;
  [...группа.children].forEach((x) => x.classList.toggle('on', x === b));
  // Форма редактора слушает input: по нему прячутся поля чужого типа и обновляется предпросмотр.
  вход.dispatchEvent(new Event('input', { bubbles: true }));
}
function открытьЗадачу(id) {
  const z = D.задачи.find((x) => s(x['ID']) === id); if (!z) return сказать('Нет такой задачи: ' + id);
  const люди = [...new Set(D.сотрудники.map((p) => s(p['Имя'])))];
  const тип0 = s(z['Тип повторения']).toLowerCase();
  const поле = ([k, t], малые) => {
    const v = s(z[k]); const п = подписьПоля(k, тип0);
    if (t.startsWith('select:')) {
      // Кнопки вместо выпадающего списка (Ильнур, 27.09); значение — в скрытом
      // поле, форма читает его как раньше.
      const opts = t.slice(7) === 'люди' ? [...люди] : t.slice(7) === 'типы' ? [...ТИПЫ_ПОВТОРА] : t.slice(7).split(',');
      if (!opts.includes(v)) opts.unshift(v);
      return `<div class="пз" data-поле="${э(k)}"><div class="подпись">${э(п)}</div><input type="hidden" name="${k}" value="${э(v)}"><div class="выбор${малые === false ? '' : ' мал'}" style="margin:4px 0 6px">${opts.map((o) =>
        `<button type="button" class="вар ${o === v ? 'on' : ''}" onclick="выбратьВариант(this,'${э(o)}')">${э(o) || '—'}</button>`).join('')}</div></div>`;
    }
    if (t === 'textarea') return `<div class="пз" data-поле="${э(k)}"><label>${э(п)}<textarea name="${k}" rows="2">${э(v)}</textarea></label></div>`;
    return `<div class="пз" data-поле="${э(k)}"><label><span class="пп">${э(п)}</span><input name="${k}" type="${t === 'date' ? 'date' : 'text'}" value="${э(v)}"></label></div>`;
  };
  const по = Object.fromEntries(ПОЛЯ_ЗАДАЧИ);
  const ф = (k, малые) => поле([k, по[k]], малые);
  const раздел = (имя, тело) => `<div class="раздел"><div class="подпись">${имя}</div>${тело}</div>`;
  const активна = s(z['Активна']).toLowerCase() === 'да' ? 'да' : 'нет';
  const ещёЗаполнено = ['Действует с', 'Действует по', 'Комментарий', 'Месяцы'].some((k) => s(z[k]));
  const d = document.getElementById('dlg');
  d.innerHTML = `<form method="dialog">
    <div class="заголовок-ряд"><div class="заголовок">${э(id)}</div>
      <input type="hidden" name="Активна" value="${активна}"><div class="выбор тумблер">
        <button type="button" class="вар ${активна === 'да' ? 'on' : ''}" onclick="выбратьВариант(this,'да')">✓ Включена</button>
        <button type="button" class="вар нет ${активна === 'нет' ? 'on' : ''}" onclick="выбратьВариант(this,'нет')">⏸ Пауза</button></div></div>
    ${раздел('Что', ф('Название') + ф('Что считать выполнением') + галерея(id))}
    ${раздел('Кому', ф('Исполнитель') + ф('Если не на смене'))}
    ${раздел('Когда', ф('Тип повторения') + ['Дата / точка отсчёта', 'Дни недели', 'Числа месяца', 'Интервал', 'Позиция'].map((k) => ф(k)).join('')
      + ф('Время') + ф('Дедлайн (часов)') + ф('Если просрочена') + '<div class="пред" id="предЗадачи"></div>')}
    ${раздел('Отчёт', ф('Ответ') + ф('Варианты'))}
    <details class="раздел"${ещёЗаполнено ? ' open' : ''}><summary>Ещё</summary>${ф('Действует с') + ф('Действует по') + ф('Месяцы') + ф('Комментарий')}</details>
    <div class="низ"><button value="cancel">Отмена</button><button class="да" value="ok">Сохранить</button></div></form>`;
  const форма = d.querySelector('form');
  // Поля чужого типа прячутся, подписи даты и интервала меняются по типу, под «Когда» — расписание словами.
  const обновить = () => {
    const f = new FormData(форма); const z2 = {}; for (const [k] of ПОЛЯ_ЗАДАЧИ) z2[k] = f.get(k) ?? '';
    const тип = s(z2['Тип повторения']).toLowerCase(); const нужны = ПОЛЯ_ТИПА[тип];
    for (const k of ['Дата / точка отсчёта', 'Дни недели', 'Числа месяца', 'Интервал', 'Позиция']) {
      const блок = форма.querySelector(`.пз[data-поле="${CSS.escape(k)}"]`); if (!блок) continue;
      блок.classList.toggle('скрыто', !!нужны && !нужны.includes(k));
      const пп = блок.querySelector('.пп'); if (пп) пп.textContent = подписьПоля(k, тип);
    }
    const вар = форма.querySelector('.пз[data-поле="Варианты"]');
    if (вар) вар.classList.toggle('скрыто', !['варианты', 'форма', 'число'].includes(s(z2['Ответ']).toLowerCase()) && !s(z2['Варианты']));
    const ч = s(z2['Дедлайн (часов)']);
    const строка = [расписание(z2) + (s(z2['Время']) ? ' в ' + s(z2['Время']) : ''), /^до/i.test(ч) ? 'срок ' + ч : ч ? 'срок ' + ч + ' ч' : '',
      s(z2['Если просрочена']) === 'следующая смена' ? 'просрочена → на следующую смену' : ''].filter(Boolean).join(' · ');
    const пред = форма.querySelector('#предЗадачи');
    if (пред) пред.textContent = (s(z2['Активна']) === 'да' ? '📅 ' : '⏸ Выключена · ') + строка;
  };
  форма.oninput = обновить; обновить();
  d.onclick = null;
  d.onclose = () => {
    if (d.returnValue !== 'ok') return;
    const f = new FormData(форма); const поля = {};
    for (const [k] of ПОЛЯ_ЗАДАЧИ) поля[k] = f.get(k) ?? '';
    правитьЗадачу(id, поля);
  };
  d.showModal();
  подгрузитьФото(d);
}

// ── «Скоро» — тот же код планировщика, что стоит в n8n ──
function прогон(д) {
  const $ = (имя) => { if (!(имя in D)) throw new Error('нет ' + имя); return { all: () => D[имя].map((json) => ({ json })) }; };
  const DT = new Proxy(DateTime, { get(t, p) { return p === 'now' ? () => д.setZone(TZ).set({ hour: 8 }) : t[p]; } });
  try { return new Function('$', 'DateTime', ПЛАНИРОВЩИК || 'return [];')($, DT).map((x) => x.json); }
  catch (e) { return []; }
}

function render() {
  D.Задачи = D.задачи; D.Сотрудники = D.сотрудники; D['График смен'] = D.график; D.Журнал = D.журнал;
  // «Настройки» не читаем ради экономии запросов — планировщику хватит горизонта.
  D.Настройки = [{ 'Ключ': 'Горизонт переноса (дней)', 'Значение': '14' },
                 { 'Ключ': 'Напоминать до дедлайна (часов)', 'Значение': '2' }];
  document.getElementById('main').innerHTML =
    { дела: vДела, скоро: vСкоро, задачи: vЗадачи, я: vЯ, новая: vНовая }[вкладка]();
  бейджиВкладок();
  подгрузитьФото();
}
// Цифры на вкладках и время данных у «⟳» (28.10): «Дела» — просрочено (красным) или на приёмку (жёлтым), «Я» — хвосты.
function бейджиВкладок() {
  const бдж = (вкл, n, c) => {
    const b = document.querySelector(`.tabs button[data-t="${вкл}"]`); if (!b) return;
    let i = b.querySelector('.бдж');
    if (!n) { if (i) i.remove(); return; }
    if (!i) { i = document.createElement('i'); b.appendChild(i); }
    i.className = 'бдж ' + c; i.textContent = n;
  };
  const т = сегодня();
  document.getElementById('тОбновлено').textContent = D.загружено && D.сейчас ? когдаСнимок(D.сейчас) : '—';
  if (!D.загружено) return;
  const просрочено = D.журнал.filter((r) => !ЗАКРЫТЫ.includes(s(r['Статус'])) && день(r) && день(r) < т).length;
  const приёмка = D.журнал.filter((r) => (s(r['Статус']) === 'Выполнена' || s(r['Статус']) === 'Проблема') && s(r['Исполнитель']) !== 'Ильнур').length;
  бдж('дела', просрочено || приёмка, просрочено ? '' : 'warn');
  бдж('я', D.журнал.filter((r) => s(r['Исполнитель']) === 'Ильнур' && !ЗАКРЫТЫ.includes(s(r['Статус'])) && день(r) && день(r) < т).length, '');
}
document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === вкладка));
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'кОбновить') { обновить(); return; }
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  вкладка = b.dataset.t;
  // Ушли с «Новой» до загрузки таблиц — остальным вкладкам без данных нечего показать.
  if (!D.загружено && вкладка !== 'новая') { состояние('загружаю…'); load(); return; }
  render();
});
// Пока на экране снимок, кнопки действий (⋯, «Сделал», «Принять», «Создать», ссылки) не работают:
// через секунду придут свежие данные, и правка уйдёт по ним. Фильтры и вкладки — можно.
document.getElementById('main').addEventListener('click', (e) => {
  if (!D.снимок) return;
  if (!e.target.closest('.ещё, .главная, .кнопка, .создать, a, .card button')) return;
  e.preventDefault(); e.stopPropagation();
  состояние('секунду — сверяюсь с таблицей, потом нажмите ещё раз');
}, true);
if (РЕЖИМ === 'pages' && !ПЛАНИРОВЩИК) кодССервера('');   // первый заход на этом телефоне — код планировщика с сервера
if (вкладка === 'новая') { render(); состояние('загружаю таблицы…'); load(true).then(() => { if (D.загружено) состояние(''); }); }
else { снимок(); load(); }
</script>
